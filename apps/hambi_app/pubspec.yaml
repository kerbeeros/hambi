name: hambi_app
description: Hambi – kooperatives Brettspiel für den Hambacher Forst.
version: 1.0.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  bloc: ^9.2.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  game_data:
    path: ../../features/game/game_data
  game_domain:
    path: ../../features/game/game_domain
  game_presentation:
    path: ../../features/game/game_presentation
  go_router: ^18.0.2
  intl: ^0.20.2
  rules_presentation:
    path: ../../features/rules/rules_presentation
  setup_presentation:
    path: ../../features/setup/setup_presentation
  shared_preferences: ^2.5.6
  ui_kit:
    path: ../../shared/ui_kit

dev_dependencies:
  bloc_lint: ^0.4.2
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
