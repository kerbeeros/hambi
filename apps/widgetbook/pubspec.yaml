name: hambi_widgetbook
description: Widgetbook catalog for the Hambi ui_kit and screens.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  game_domain:
    path: ../../features/game/game_domain
  game_presentation:
    path: ../../features/game/game_presentation
  ui_kit:
    path: ../../shared/ui_kit
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0

dev_dependencies:
  build_runner: ^2.4.0
  very_good_analysis: ^11.0.0
  widgetbook_generator: ^3.24.0

flutter:
  uses-material-design: true
