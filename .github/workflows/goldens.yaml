name: goldens

# Generates the platform-independent CI goldens on Linux, the platform the
# ci workflow compares them on (ADR 0004), and commits them to the branch.
# Runs on a push to a branch whose head commit message contains
# "[update-goldens]", or manually. Commits pushed with GITHUB_TOKEN do not
# trigger other workflows, so push again afterwards to run the ci workflow.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[update-goldens]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Update CI goldens
        run: |
          for package in shared/ui_kit features/game/game_presentation; do
            (cd "$package" && flutter test --tags golden --update-goldens --dart-define=CI=true)
          done
      - name: Commit CI goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/goldens/ci/*'
          if git diff --cached --quiet; then
            echo "CI goldens are up to date."
          else
            git commit -m "test: update CI goldens"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
